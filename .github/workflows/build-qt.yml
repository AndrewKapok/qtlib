name: Build Qt Static with WebEngine (Individual .lib Upload)

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version (e.g. 6.5.3). Leave empty for latest stable.'
        required: false
        default: ''
      modules_to_skip:
        description: 'Comma separated modules to skip. Default: empty = build all.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 480
    env:
      QT_INSTALL_DIR: ${{ github.workspace }}\qt-install
    outputs:
      version: ${{ steps.resolve_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 解析版本 ----------
      - name: Resolve Qt version
        id: resolve_version
        shell: pwsh
        run: |
          $inputVer = '${{ inputs.qt_version }}'.Trim()
          if ($inputVer) {
            Write-Host "Using provided version: $inputVer"
            echo "version=$inputVer" >> $env:GITHUB_OUTPUT
          } else {
            $baseUrl = "https://download.qt.io/official_releases/qt/"
            $response = Invoke-WebRequest -Uri $baseUrl -UseBasicParsing
            $links = $response.Links | Where-Object { $_.href -match '^6\.\d+\.\d+/$' } | ForEach-Object { $_.href.Trim('/') }
            $latest = $links | Sort-Object {[version]$_} -Descending | Select-Object -First 1
            if (-not $latest) {
              Write-Error "Cannot find any Qt 6.x release."
              exit 1
            }
            Write-Host "Resolved latest version: $latest"
            echo "version=$latest" >> $env:GITHUB_OUTPUT
          }

      # ---------- 安装编译依赖（包括 aria2） ----------
      - name: Install build dependencies
        shell: pwsh
        run: |
          python --version
          perl --version
          # 编译工具
          choco install ninja -y --no-progress
          # WebEngine 依赖
          choco install winflexbison3 gperf -y --no-progress
          # 下载加速工具 aria2
          choco install aria2 -y --no-progress
          refreshenv
          ninja --version
          win_flex --version
          win_bison --version
          gperf --version
          aria2c --version

      # ---------- 使用 aria2c 多线程下载源码 ----------
      - name: Download Qt source with aria2c
        env:
          VER: ${{ steps.resolve_version.outputs.version }}
        shell: pwsh
        run: |
          $majorMinor = $env:VER.Substring(0, $env:VER.LastIndexOf('.'))
          $url = "https://download.qt.io/official_releases/qt/$majorMinor/$env:VER/single/qt-everywhere-src-$env:VER.zip"
          Write-Host "Downloading: $url (using aria2c with 8 connections)"

          # 清理残留
          Remove-Item -Force qt-src.zip -ErrorAction SilentlyContinue

          # 下载（不指定 -o，让 aria2c 自动命名）
          aria2c -x 8 -s 8 --summary-interval=30 --allow-overwrite=true "$url"

          # 查找下载的 zip
          $zipFile = Get-ChildItem -Filter "qt-everywhere-src-*.zip" | Select-Object -First 1
          if (-not $zipFile) {
            Write-Error "Downloaded Qt source zip not found!"
            exit 1
          }
          Write-Host "Found zip: $($zipFile.Name)"

          # 使用 7z 多线程解压，-o 后跟输出目录，必须用引号括起来
          Write-Host "Extracting with 7z (multi-threaded)..."
          7z x "$($zipFile.FullName)" "-o." -y

          # 定位源码目录
          $folder = Get-ChildItem -Directory | Where-Object { $_.Name -like 'qt-everywhere-src-*' } | Select-Object -First 1
          echo "SRC_DIR=$pwd\$folder" >> $env:GITHUB_ENV

      # ---------- 配置 (static, release, /O2) ----------
      - name: Configure Qt
        shell: cmd
        run: |
          cd /d %SRC_DIR%
          set "SKIP_ARGS="
          if not "${{ inputs.modules_to_skip }}"=="" (
            for %%i in (${{ inputs.modules_to_skip }}) do set "SKIP_ARGS=!SKIP_ARGS! -skip %%i"
          )
          call configure.bat ^
            -static ^
            -static-runtime ^
            -release ^
            -prefix "%QT_INSTALL_DIR%" ^
            -opensource ^
            -confirm-license ^
            -nomake examples ^
            -nomake tests ^
            -platform win32-msvc ^
            -mp ^
            %SKIP_ARGS%
        timeout-minutes: 10

      # ---------- 编译 ----------
      - name: Build Qt
        shell: cmd
        run: |
          cd /d %SRC_DIR%
          cmake --build . --parallel --target install
        timeout-minutes: 460

      # ---------- 收集所有 .lib 文件 ----------
      - name: List all .lib files
        id: list_libs
        shell: pwsh
        run: |
          $libs = Get-ChildItem -Path "$env:QT_INSTALL_DIR\lib" -Filter *.lib -Recurse |
                  ForEach-Object { $_.FullName }
          $libsString = $libs -join "`n"
          "lib_paths<<EOF" >> $env:GITHUB_OUTPUT
          $libsString >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          Write-Host "Found $($libs.Count) library files."

      # ---------- 逐个上传到 Release ----------
      - name: Upload each .lib to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qt-static-${{ steps.resolve_version.outputs.version }}
          name: Qt ${{ steps.resolve_version.outputs.version }} Static Libraries (MSVC 2022 x64)
          body: |
            Static `.lib` files compiled from Qt ${{ steps.resolve_version.outputs.version }} source.
            - **Platform**: Windows x64
            - **Compiler**: MSVC 2022 (Visual Studio 2022)
            - **Configuration**: static, release, static-runtime (/MT), /O2 optimization
            - **Included modules**: all (unless skipped manually)
            - **Download acceleration**: Qt source fetched via aria2c (multi-connection)
            Each `.lib` is uploaded individually (no archive).
          files: ${{ steps.list_libs.outputs.lib_paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
