name: Build Qt Static Libraries

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt 版本号 (例如: v6.8.2, v5.15.16-lts)'
        required: true
        default: 'v6.8.2'
        type: string
      qt_module_subset:
        description: '子模块范围 (留空=全部, qtbase, essential, addon)'
        required: false
        default: 'essential'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-qt:
    runs-on: windows-latest
    env:
      QT_SRC_DIR: ${{ github.workspace }}/qt-src
      QT_BUILD_DIR: ${{ github.workspace }}/qt-build
      QT_INSTALL_DIR: ${{ github.workspace }}/qt-install

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 安装依赖 ==========
      - name: Install build dependencies
        run: |
          choco install python ninja strawberryperl -y --no-progress
          echo "C:\Program Files\Python3\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\Python3" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ========== 克隆 Qt 源码（包含所有子模块）==========
      - name: Clone Qt source with submodules
        run: |
          git clone --branch ${{ inputs.qt_version }} --depth 1 --recursive https://code.qt.io/qt/qt5.git ${{ env.QT_SRC_DIR }}
        shell: pwsh

      # ========== 准备子模块过滤（根据用户选择的模块集删除不需要的子模块）==========
      # 注意：如果不做过滤，所有子模块都会被克隆，但编译时可以通过 -skip 跳过，也可以在此删除不需要的子模块目录以节省空间
      - name: Remove unwanted modules (optional)
        if: inputs.qt_module_subset != ''
        working-directory: ${{ env.QT_SRC_DIR }}
        run: |
          # 定义保留模块列表
          $modulesToKeep = @()
          $subset = "${{ inputs.qt_module_subset }}"
          if ($subset -eq "qtbase") {
            $modulesToKeep = @("qtbase")
          } elseif ($subset -eq "essential") {
            $modulesToKeep = @("qtbase", "qtsvg", "qttools", "qttranslations", "qtdeclarative", "qtxmlpatterns")
          } elseif ($subset -eq "addon") {
            $modulesToKeep = @("qtbase", "qtsvg", "qttools", "qttranslations", "qtdeclarative", "qtxmlpatterns",
                               "qtimageformats", "qtmultimedia", "qtserialport", "qtwebsockets", "qtscript")
          }
          # 删除不在保留列表中的模块目录
          Get-ChildItem -Directory -Exclude ".git" | ForEach-Object {
            if ($modulesToKeep -notcontains $_.Name) {
              Write-Host "Removing unwanted module: $($_.Name)"
              Remove-Item -Recurse -Force $_.FullName
              # 同时从 .gitmodules 中注释掉，避免 configure 尝试构建
            }
          }
        shell: pwsh

      # ========== 配置编译（静态库 + O2 优化）==========
      - name: Configure Qt
        working-directory: ${{ env.QT_BUILD_DIR }}
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.QT_BUILD_DIR }}
          cd ${{ env.QT_BUILD_DIR }}
          ${{ env.QT_SRC_DIR }}/configure.bat `
            -prefix ${{ env.QT_INSTALL_DIR }} `
            -release `
            -static `
            -static-runtime `
            -optimize-size `
            -opengl desktop `
            -accessibility `
            -no-icu `
            -no-sql-sqlite `
            -no-qml-debug `
            -nomake examples `
            -nomake tests `
            -skip qtwebengine `
            -no-dbus `
            -no-feature-gssapi `
            -opensource `
            -confirm-license
        shell: pwsh

      # ========== 编译 ==========
      - name: Build Qt
        working-directory: ${{ env.QT_BUILD_DIR }}
        run: |
          cmake --build . --parallel --config Release

      # ========== 安装 ==========
      - name: Install Qt
        working-directory: ${{ env.QT_BUILD_DIR }}
        run: |
          cmake --install . --config Release

      # ========== 收集所有 .lib 文件 ==========
      - name: Collect lib files
        working-directory: ${{ env.QT_INSTALL_DIR }}
        run: |
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}/qt-libs
          Get-ChildItem -Path . -Recurse -Filter "*.lib" | ForEach-Object {
            $relativePath = $_.FullName.Substring((Get-Location).Path.Length + 1)
            $safeName = $relativePath -replace '[\\/]', '_'
            Copy-Item $_.FullName -Destination "${{ github.workspace }}/qt-libs\$safeName"
          }
          Get-ChildItem -Path . -Recurse -Filter "*.prl" | ForEach-Object {
            $relativePath = $_.FullName.Substring((Get-Location).Path.Length + 1)
            $safeName = $relativePath -replace '[\\/]', '_'
            Copy-Item $_.FullName -Destination "${{ github.workspace }}/qt-libs\$safeName"
          }
        shell: pwsh

      - name: List collected libs
        run: |
          Write-Host "=== 收集到的 .lib 文件 ==="
          Get-ChildItem ${{ github.workspace }}/qt-libs -Filter "*.lib" | ForEach-Object { Write-Host $_.Name }
          Write-Host "=========================="
          Write-Host "文件总数: $((Get-ChildItem ${{ github.workspace }}/qt-libs -File).Count)"
        shell: pwsh

      # ========== 打包头文件 ==========
      - name: Package includes
        run: |
          Compress-Archive -Path "${{ env.QT_INSTALL_DIR }}/include/*" -DestinationPath "${{ github.workspace }}/qt-libs/include.zip" -Force
        shell: pwsh

      # ========== 上传到 GitHub Release ==========
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "Qt ${{ inputs.qt_version }} Static Libraries (Windows x64)"
          tag_name: "qt-${{ inputs.qt_version }}-static"
          body: |
            ## Qt ${{ inputs.qt_version }} 静态库 (Windows x64)
            
            ### 编译配置
            - 编译器: MSVC (Visual Studio 2022)
            - 架构: x64
            - 优化: O2 (`-optimize-size`)
            - 链接: 静态库 (`-static -static-runtime`)
            - 子模块: ${{ inputs.qt_module_subset || '全部' }}
            
            ### 使用方法
            1. 下载所需模块的 `.lib` 文件和头文件包 (`include.zip`)
            2. 在 MSVC 项目中添加库路径和头文件路径
            3. 链接对应的 `.lib` 文件
          files: |
            ${{ github.workspace }}/qt-libs/*.lib
            ${{ github.workspace }}/qt-libs/*.prl
            ${{ github.workspace }}/qt-libs/include.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
