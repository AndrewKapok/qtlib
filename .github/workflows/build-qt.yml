name: Build Qt Static Libraries

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt 版本号 (例如: 6.8.2, 6.9.0, 5.15.16)'
        required: true
        default: '6.8.2'
        type: string
      qt_module_subset:
        description: '要编译的子模块 (qtbase 或 essential 或 addon 或 留空表示全部)'
        required: false
        default: 'essential'
        type: choice
        options:
          - ''
          - 'qtbase'
          - 'essential'
          - 'addon'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-qt:
    runs-on: windows-latest
    env:
      QT_SRC_DIR: ${{ github.workspace }}/qt-src
      QT_BUILD_DIR: ${{ github.workspace }}/qt-build
      QT_INSTALL_DIR: ${{ github.workspace }}/qt-install
      MSVC_ARCH: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== 1. 安装编译依赖 ==========
      - name: Install build dependencies
        run: |
          choco install python ninja -y --no-progress
          # 添加 Python 和 Ninja 到 PATH
          echo "C:\Program Files\Python3\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\Python3" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ========== 2. 克隆 Qt 源码 ==========
      - name: Clone Qt source
        run: |
          git clone --branch v${{ inputs.qt_version }} --depth 1 https://code.qt.io/qt/qt5.git ${{ env.QT_SRC_DIR }}

      - name: Initialize submodules
        working-directory: ${{ env.QT_SRC_DIR }}
        run: |
          if "${{ inputs.qt_module_subset }}" == "" (
            perl init-repository --no-update
          ) elseif "${{ inputs.qt_module_subset }}" == "qtbase" (
            perl init-repository --module-subset=qtbase --no-update
          ) elseif "${{ inputs.qt_module_subset }}" == "essential" (
            perl init-repository --module-subset=essential --no-update
          ) elseif "${{ inputs.qt_module_subset }}" == "addon" (
            perl init-repository --module-subset=addon --no-update
          ) else (
            perl init-repository --module-subset=${{ inputs.qt_module_subset }} --no-update
          )
        shell: cmd

      # ========== 3. 配置编译 (静态库 + O2 优化) ==========
      - name: Configure Qt
        working-directory: ${{ env.QT_BUILD_DIR }}
        run: |
          mkdir ${{ env.QT_BUILD_DIR }}
          cd ${{ env.QT_BUILD_DIR }}
          ${{ env.QT_SRC_DIR }}/configure.bat `
            -prefix ${{ env.QT_INSTALL_DIR }} `
            -release `
            -static `
            -static-runtime `
            -optimize-size `
            -opengl desktop `
            -accessibility `
            -no-icu `
            -no-sql-sqlite `
            -no-qml-debug `
            -nomake examples `
            -nomake tests `
            -skip qtwebengine `
            -no-dbus `
            -no-feature-gssapi `
            -opensource `
            -confirm-license
        shell: pwsh

      # ========== 4. 编译 ==========
      - name: Build Qt
        working-directory: ${{ env.QT_BUILD_DIR }}
        run: |
          cmake --build . --parallel --config Release

      # ========== 5. 安装 ==========
      - name: Install Qt
        working-directory: ${{ env.QT_BUILD_DIR }}
        run: |
          cmake --install . --config Release

      # ========== 6. 收集所有 .lib 文件 ==========
      - name: Collect lib files
        working-directory: ${{ env.QT_INSTALL_DIR }}
        run: |
          mkdir ${{ github.workspace }}/qt-libs
          Get-ChildItem -Path . -Recurse -Filter "*.lib" | ForEach-Object {
            $relativePath = $_.FullName.Substring((Get-Location).Path.Length + 1)
            $safeName = $relativePath -replace '[\\/]', '_'
            Copy-Item $_.FullName -Destination "${{ github.workspace }}/qt-libs\$safeName"
          }
          # 也复制 .prl 文件（静态库的导入库描述）
          Get-ChildItem -Path . -Recurse -Filter "*.prl" | ForEach-Object {
            $relativePath = $_.FullName.Substring((Get-Location).Path.Length + 1)
            $safeName = $relativePath -replace '[\\/]', '_'
            Copy-Item $_.FullName -Destination "${{ github.workspace }}/qt-libs\$safeName"
          }
        shell: pwsh

      - name: List collected libs
        run: |
          Write-Host "=== 收集到的 .lib 文件 ==="
          Get-ChildItem ${{ github.workspace }}/qt-libs -Filter "*.lib" | ForEach-Object { Write-Host $_.Name }
          Write-Host "=========================="
          Write-Host "文件总数: $((Get-ChildItem ${{ github.workspace }}/qt-libs -File).Count)"
        shell: pwsh

      # ========== 7. 打包头文件和库文件（可选）==========
      - name: Package includes
        run: |
          # 将头文件目录打包
          Compress-Archive -Path "${{ env.QT_INSTALL_DIR }}/include/*" -DestinationPath "${{ github.workspace }}/qt-libs/include.zip"
        shell: pwsh

      # ========== 8. 上传到 GitHub Release ==========
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "Qt ${{ inputs.qt_version }} Static Libraries (Windows x64)"
          tag_name: "qt-${{ inputs.qt_version }}-static"
          body: |
            ## Qt ${{ inputs.qt_version }} 静态库 (Windows x64)
            
            ### 编译配置
            - 编译器: MSVC (Visual Studio 2022)
            - 架构: x64
            - 优化: O2 (`-optimize-size`)
            - 链接: 静态库 (`-static -static-runtime`)
            - 子模块: ${{ inputs.qt_module_subset || '全部' }}
            
            ### 使用方法
            1. 下载所需模块的 .lib 文件和头文件包 (`include.zip`)
            2. 在 MSVC 项目中添加库路径和头文件路径
            3. 链接对应的 .lib 文件
          files: |
            ${{ github.workspace }}/qt-libs/*.lib
            ${{ github.workspace }}/qt-libs/*.prl
            ${{ github.workspace }}/qt-libs/include.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
